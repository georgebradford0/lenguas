[package]
name = "lenguas"
version = "0.1.1"
edition = "2021"
description = "Offline tooling for the Lenguas reading app"
publish = false

[[bin]]
name = "lenguas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
futures = "0.3"

# Hashing
sha2 = "0.10"
hex = "0.4"

# HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# EPUB / HTML / XML
zip = { version = "2", default-features = false, features = ["deflate"] }
scraper = "0.20"
ego-tree = "0.6"
regex = "1"
html-escape = "0.2"

# AWS S3
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# Pretty progress
indicatif = "0.17"
