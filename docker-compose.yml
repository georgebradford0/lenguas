name: lenguas-dev

services:
  api:
    build: ./api/v0
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - TTS_URL=http://tts:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}

  # Opt-in (large image): docker compose --profile tts up
  tts:
    build: ./tts
    profiles: ["tts"]
    volumes:
      - tts-cache:/cache

volumes:
  tts-cache:
